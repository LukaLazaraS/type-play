# The live site on the server (/opt/typeplay): Next.js behind Caddy. `deploy.mjs site` uploads
# this folder with the pruned source in src/ and runs `docker compose up -d --build`.
name: typeplay
services:
  web:
    build:
      context: ./src
      args:
        NEXT_PUBLIC_GAMES_ORIGIN: https://typeplay.dev
        NEXT_PUBLIC_API_ORIGIN: https://api.typeplay.app
        # The signed-in app (/create, /games): "1" the day beta 1 starts (Luka's call), then deploy.mjs site.
        NEXT_PUBLIC_APP: "0"
        # The closed beta (beta 1): the signed-out /create and /games say so before sign-in. Keep it with the API's
        # BETA_INVITE_ONLY (deploy/api/compose.yaml): "0" for both when the app opens to everyone.
        NEXT_PUBLIC_CLOSED_BETA: "1"
        # Paddle.js (payments part 3): the environment and the client-side token (public by design: test_… / live_…).
        # Empty = the billing page says "opens here soon". Set with the API's PADDLE_ENV (deploy/api/compose.yaml).
        NEXT_PUBLIC_PADDLE_ENV: ""
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ""
    init: true
    restart: unless-stopped
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  caddy_data:
  caddy_config:
