# The Gradle user home every Android build runs with (GRADLE_USER_HOME = a copy of the seed,
# deploy/api/Dockerfile "gradle-seed"). This file wins over the template's gradle.properties
# (-Xmx4536m, daemon on): one build must fit next to an agent run under the runner's memory cap.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.configureondemand=false
# The runner has no internet: AGP must never try to fetch a missing SDK package (it would hang).
android.builder.sdkDownload=false
